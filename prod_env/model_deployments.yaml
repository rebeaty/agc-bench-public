  - name: google/gemini-3-flash-preview
    model_name: google/gemini-3-flash-preview
    tokenizer_name: huggingface/gpt2
    max_sequence_length: 1048576
    client_spec:
      # ThinkingOffGoogleGenAIClient force-injects thinking_budget=0 for
      # gemini-3* regardless of YAML wiring. The args.thinking_config below
      # is included for compatibility with the parent client.
      class_name: "clients.thinking_off_gemini_client.ThinkingOffGoogleGenAIClient"
      args:
        thinking_config:
          thinkingBudget: 0

  # OpenRouter-routed variant of the same model. Used as judge when the
  # direct Google API throttles or rejects scientific content. Different
  # safety-filter behavior because it routes through OR's provider mesh.
  - name: openrouter/google/gemini-3-flash-preview
    model_name: google/gemini-3-flash-preview
    tokenizer_name: huggingface/gpt2
    max_sequence_length: 1048576
