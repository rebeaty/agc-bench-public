    tokenizer_name: huggingface/gpt2
    max_sequence_length: 1048576
    client_spec:
      # Use our subclass for gemini-3* — force thinking_budget=0 defensively.
      # Was thinkingLevel: "minimal" (still spends some tokens on thinking);
      # standardizing on thinking_budget=0 across all gemini-3* test models.
      class_name: "clients.thinking_off_gemini_client.ThinkingOffGoogleGenAIClient"
      args:
        thinking_config:
          thinkingBudget: 0

