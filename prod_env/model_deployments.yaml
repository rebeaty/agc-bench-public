model_deployments:
  # ── Task B: non-Gemini models via OpenRouter ────────────────
  # These are the models we use for datasets with num_outputs>8 that
  # Google's Gemini API can't serve (candidate_count capped at 8).
  # Route explicitly through OpenRouterClient (which extends HELM's
  # HELM OpenAIClient / ChatCompletions) so we bypass the newer
  # openai_responses_client.py. That client's pydantic Response model
  # rejects `prompt_cache_retention='in_memory'` from current OpenAI API
  # responses returned by current OpenAI-compatible APIs.
  # Keep google/gemini-* deployments out of this OpenRouter section:
  # Gemini traffic always goes direct Google API, never OpenRouter.
  - name: openai/gpt-5-mini
    model_name: openai/gpt-5-mini
    tokenizer_name: huggingface/gpt2
    max_sequence_length: 131072
    client_spec:
      class_name: "helm.clients.openrouter_client.OpenRouterClient"
      args:
        openrouter_model_name: "openai/gpt-5-mini"

  - name: anthropic/claude-haiku-4.5
    model_name: anthropic/claude-haiku-4.5
    tokenizer_name: huggingface/gpt2
    max_sequence_length: 200000
    client_spec:
