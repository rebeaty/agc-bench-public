# Evaluation metrics for each dataset
# Registry file for AGC-Bench metric mappings

datasets:
  aaar:
    metrics:
      - name: "exact_match"
        in_helm: true
        type: "formula_based"
        helm_class: "helm.benchmark.metrics.basic_metrics.BasicGenerationMetric"
      - name: "quasi_exact_match"
        in_helm: true
        type: "formula_based"
