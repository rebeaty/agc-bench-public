        judge_max_new_tokens: 256

  aidanbench:
    metrics:
      - name: "self_bleu"
        in_helm: true
        type: "formula_based"
        helm_class: "helm.benchmark.metrics.disinformation_metrics.DisinformationMetric"
      - name: "coherence_score"
        in_helm: false
        type: "llm_judge"
        judge_model_name: "openai/o1-mini"
        judge_prompt: |
          You are evaluating responses to the question: "{input_text}"

          Rate the following response on a scale of 0-100 for coherence, quality,
          and appropriateness. A score of 0 means completely incoherent or off-topic.
          A score of 100 means a perfect, insightful, well-reasoned response.

          Response: {generated_response}

          Score (0-100):
        judge_temperature: 0.0
        judge_max_new_tokens: 64
      - name: "novelty_embedding_similarity"
        in_helm: false
        type: "model_based"
        helm_class: null
        metric_model: "text-embedding-ada-002"

