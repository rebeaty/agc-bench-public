      - name: "bleu_4"
        in_helm: true
        type: "formula_based"
        helm_class: "helm.benchmark.metrics.basic_metrics.BasicGenerationMetric"
      - name: "sentence_bert_f1"
        in_helm: false
        type: "model_based"
        helm_class: "metrics.sentence_bert_metric.SentenceBertMetric"
        metric_model: "all-mpnet-base-v2"
      - name: "sentence_bert_precision"
        in_helm: false
        type: "model_based"
        helm_class: "metrics.sentence_bert_metric.SentenceBertMetric"
        metric_model: "all-mpnet-base-v2"
      - name: "sentence_bert_recall"
        in_helm: false
        type: "model_based"
        helm_class: "metrics.sentence_bert_metric.SentenceBertMetric"
        metric_model: "all-mpnet-base-v2"
      - name: "recall_gt_entail_score"
        in_helm: false
        type: "llm_judge"
        judge_model_name: "openai/gpt-4-1106-preview"
        judge_prompt: null
        judge_temperature: 0.0
        judge_max_new_tokens: 256
      - name: "precision_pred_entail_score"
        in_helm: false
        type: "llm_judge"
        judge_model_name: "openai/gpt-4-1106-preview"
        judge_prompt: null
